<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Sources Modal — Local Test</title>
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <style>
        :root {
            --color1: rgb(200, 200, 200);
            --color2: rgb(180, 180, 180);
            --color3: rgb(220, 220, 220);
            --color4: rgb(230, 230, 230);
            --color8: rgb(150, 150, 150);
            --color9: rgb(120, 120, 120);
            --colorText: rgb(0, 0, 0);
            --colorTextAlt: rgb(30, 30, 30);
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--color3);
            color: var(--colorText);
            margin: 0;
            padding: 20px;
        }

        .custom-modal {}

        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            padding-top: 10vh;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
        }

        .modal-content {
            position: relative;
            background-color: var(--color1);
            margin: auto;
            width: 55%;
            height: 70%;
            border: solid black;
            display: flex;
            flex-direction: column;
        }

        .manual-close {
            position: absolute;
            top: 5px;
            right: 10px;
            cursor: pointer;
            font-size: 20px;
            z-index: 10;
        }

        .link {
            color: var(--colorText);
            text-decoration: underline;
            cursor: pointer;
        }

        /* --- Item Sources --- */
        .highest3 {
            background-color: rgb(50, 180, 100);
            width: 125px;
            height: 40px;
            font-size: 16px;
            color: white;
            border: 1px solid black;
            outline: none;
            transition-duration: 0.4s;
            cursor: pointer;
            margin: 5px;
        }

        .highest3:hover {
            background-color: rgb(30, 155, 80);
        }

        .highest3:active {
            background-color: rgb(75, 200, 125);
        }

        .highest3-searchcontainer {
            padding: 5px 15px;
            font-size: 1.7vh;
        }

        input#searchHighest3 {
            font-size: 2.1vh;
        }

        .highest3-title {
            font-size: 14px;
            display: inline-flex;
            width: 100%;
            font-weight: bold;
            height: 5%;
            background-color: var(--color2);
            overflow-y: hidden;
        }

        .highest3-data {
            overflow-y: auto;
            height: 88%;
        }

        .h3-style-button {
            padding: 10px 1vw;
            text-align: center;
            display: flex;
            align-items: center;
            cursor: pointer;
            -webkit-transition-duration: 0.4s;
            transition-duration: 0.4s;
        }

        .h3-style-button:hover {
            background-color: var(--color8);
        }

        .h3-style-button.h3-active-tab {
            background-color: var(--color9);
        }

        .highest3-item {
            padding: 8px 15px;
            border-bottom: 1px solid var(--color4);
        }

        .highest3-item-name {
            font-weight: bold;
            padding-bottom: 4px;
        }

        .highest3-item-source {
            padding-left: 15px;
            font-size: 0.9em;
            color: var(--colorTextAlt);
        }

        .highest3-item.searchhide {
            display: none;
        }

        .highest3-chunk-link {
            margin-left: 5px;
        }

        .highest3-chunk-toggle {
            margin-left: 5px;
        }

        .highest3-chunk-list {
            padding-left: 30px;
            padding-top: 2px;
        }

        .highest3-chunk-entry {
            padding: 1px 0;
        }

        /* Test harness styles */
        .test-buttons { margin-bottom: 10px; }
        .highest { background-color: rgb(255, 50, 150); width: 125px; height: 40px; font-size: 16px; color: white; border: 1px solid black; cursor: pointer; margin: 5px; }
        .highest2 { background-color: rgb(100, 100, 225); width: 125px; height: 40px; font-size: 16px; color: white; border: 1px solid black; cursor: pointer; margin: 5px; }
        .info { margin-top: 15px; padding: 10px; background: var(--color4); font-size: 13px; }
        .nav-log { margin-top: 10px; padding: 8px; background: #fff; border: 1px solid #aaa; font-family: monospace; font-size: 12px; min-height: 20px; }
    </style>
</head>
<body>
    <div class="test-buttons">
        <button class='highest' disabled>Current BIS</button>
        <button class='highest2' disabled>Activity Info</button>
        <button class='highest3' onclick="openHighest3()">Item Sources</button>
    </div>
    <div class="info">
        <b>Local Test Harness</b> — Click "Item Sources" to open the modal.
        Mock data contains ~25 items across all source types.
        Test: tab switching, search filtering, chunk links (single and expandable), click-outside dismiss, Escape key.
    </div>
    <div class="nav-log" id="navLog">Chunk navigation log: (click a chunk link to test)</div>
    <div class="custom-modal"></div>

<script>
// --- Mock globals ---
let inEntry = false;
let importMenuOpen = false;
let manualModalOpen = false;
let detailsModalOpen = false;
let notesModalOpen = false;
let highscoreMenuOpen = false;
let helpMenuOpen = false;
let onMobile = false;
let modalOutsideTime = 0;
let highest3ModalOpen = false;
let highestTab3;

let hideMobileMenu = function() {}

let scrollToChunkCanvas = function(chunkId) {
    $('#navLog').text('Chunk navigation log: scrollToChunkCanvas(' + chunkId + ') called');
}

// --- Mock modal system ---
let modalContents = {
    'highest3Modal': `
        <i class="manual-close pic fa-solid fa-times noscrollhard" onclick="closeHighest3()">✕</i>
        <div id="highest3-searchcontainer" class="highest3-searchcontainer noscroll">
            <input type="text" placeholder="Search items..." id="searchHighest3" class="noscrollhard"
            oninput="searchHighest3()" autocomplete="off" />
        </div>
        <div id="highest3-title" class="highest3-title noscroll"></div>
        <div id="highest3-data" class="highest3-data noscroll"></div>
    `
};

window.modal = {
    generate(id, mobile) {
        $(`#${id}`).remove();
        let el = `<div id="${id}" class="modal${mobile ? ' mobile' : ''}"><div class="modal-content noscroll">${modalContents[id]}</div></div>`;
        $('.custom-modal').append(el);
    }
};

// --- Mock chunkInfo ---
let chunkInfo = {
    chunks: {
        '12593': { 'Nickname': 'Lumbridge' },
        '12850': { 'Nickname': 'Lumbridge Swamp' },
        '12851': { 'Nickname': 'Al Kharid' },
        '12338': { 'Nickname': 'Varrock West' },
        '12339': { 'Nickname': 'Varrock East' },
        '12082': { 'Nickname': 'Barbarian Village' },
        '11828': { 'Nickname': 'Falador' },
        '13108': { 'Nickname': 'Mining Site' },
        '11826': { 'Nickname': 'Taverly' }
    }
};

// --- Mock baseChunkData ---
let baseChunkData = {
    items: {
        'Bones': { 'Chicken': 'primary-drop', 'Cow': 'primary-drop', 'Goblin': 'primary-drop' },
        'Raw chicken': { 'Chicken': 'primary-drop' },
        'Cowhide': { 'Cow': 'primary-drop' },
        'Raw beef': { 'Cow': 'primary-drop' },
        'Feather': { 'Chicken': 'primary-drop', '12850': 'primary-spawn' },
        'Dragon bones': { 'Blue dragon': 'secondary-drop', 'Green dragon': 'secondary-drop' },
        'Dragon scimitar': { 'Monkey Guard': 'secondary-drop' },
        'Rune platebody': { 'Iron dragon': 'secondary-drop', 'Oziach': 'shop' },
        'Bronze sword': { '12593': 'primary-spawn', 'Varrock Sword Shop': 'shop' },
        'Iron ore': { '13108': 'primary-spawn', '12850-1': 'primary-spawn' },
        'Logs': { '12593': 'primary-spawn', '12850': 'secondary-spawn' },
        'Bucket of water': { 'Lumbridge General Store': 'shop' },
        'Pot of flour': { 'Lumbridge General Store': 'shop' },
        'Bronze pickaxe': { 'Nurmof': 'shop' },
        'Staff of fire': { 'Zaff': 'shop' },
        'Mind rune': { 'Aubury': 'shop', '12593-2': 'primary-spawn' },
        'Cooked chicken': { 'Cook raw chicken': 'multi-Cooking' },
        'Bread': { 'Bake bread dough': 'multi-Cooking' },
        'Bronze bar': { 'Smelt bronze': 'multi-Smithing' },
        'Iron bar': { 'Smelt iron ore': 'multi-Smithing' },
        'Grimy ranarr weed': { 'Harvest ranarr seed': 'multi-Farming' },
        'Ranarr potion (unf)': { 'Make ranarr potion': 'multi-Herblore' },
        'Oak plank': { 'Make oak plank': 'multi-Construction' },
        'Unarmed': { 'Built-in': 'secondary-Nonskill' },
        'Quest point cape': { 'Manually Added*': 'primary-Nonskill' },
        '~|Steel arrow|~*': { 'Dark wizard': 'primary-drop', 'Varrock Archery Shop': 'shop' },
        'Test ^hidden': { 'Should not appear': 'primary-drop' }
    },
    monsters: {
        'Chicken': { '12593': true, '12850': true },
        'Cow': { '12593': true, '12851': true },
        'Goblin': { '12593': true, '12082': true, '12338': true },
        'Blue dragon': { '11826': true },
        'Green dragon': { '12082': true, '12338': true },
        'Monkey Guard': {},
        'Iron dragon': { '11828': true },
        'Dark wizard': { '12338': true, '12339': true }
    },
    shops: {
        'Oziach': { '12338': true },
        'Varrock Sword Shop': { '12339': true },
        'Lumbridge General Store': { '12593': true },
        'Nurmof': { '11828': true },
        'Zaff': { '12339': true },
        'Aubury': { '12339': true },
        'Varrock Archery Shop': { '12339': true }
    }
};

// --- Item Sources functions ---
let formatSourceType = function(type) {
    if (type === 'primary-drop') return 'Drop';
    if (type === 'secondary-drop') return 'Drop (rare)';
    if (type === 'primary-spawn') return 'Spawn';
    if (type === 'secondary-spawn') return 'Spawn (secondary)';
    if (type === 'shop') return 'Shop';
    if (type === 'primary-Nonskill') return 'Other';
    if (type === 'secondary-Nonskill') return 'Other (secondary)';
    if (type.startsWith('multi-')) return 'Processing (' + type.split('-')[1] + ')';
    return type;
}

let getSourceChunks = function(sourceKey, sourceType) {
    if (sourceType.includes('spawn')) {
        let chunkId = sourceKey.split('-')[0];
        return chunkId.match(/^[0-9]+$/) ? [chunkId] : [];
    }
    if (sourceType.includes('drop') && !!baseChunkData['monsters'] && !!baseChunkData['monsters'][sourceKey]) {
        return Object.keys(baseChunkData['monsters'][sourceKey]);
    }
    if (sourceType === 'shop' && !!baseChunkData['shops'] && !!baseChunkData['shops'][sourceKey]) {
        return Object.keys(baseChunkData['shops'][sourceKey]);
    }
    return [];
}

let getChunkLabel = function(chunkId) {
    let id = chunkId.split('-')[0];
    if (!!chunkInfo && !!chunkInfo['chunks'] && !!chunkInfo['chunks'][id] && !!chunkInfo['chunks'][id]['Nickname']) {
        return chunkInfo['chunks'][id]['Nickname'] + '(' + id + ')';
    }
    return id;
}

let h3ChunkUid = 0;

let buildChunkLinksHtml = function(chunks) {
    if (chunks.length === 0) return '';
    if (chunks.length === 1) {
        let id = chunks[0].split('-')[0];
        return ` <span class='noscroll link highest3-chunk-link' onclick='closeHighest3(); scrollToChunkCanvas(${id})'>${getChunkLabel(chunks[0])}</span>`;
    }
    let uid = h3ChunkUid++;
    let html = ` <span class='noscroll highest3-chunk-toggle link' onclick='$(".h3-chunks-${uid}").toggle()'>${chunks.length} chunks ▾</span>`;
    html += `<div class='noscroll highest3-chunk-list h3-chunks-${uid}' style='display:none'>`;
    chunks.forEach((chunk) => {
        let id = chunk.split('-')[0];
        html += `<div class='noscroll highest3-chunk-entry'><span class='noscroll link' onclick='closeHighest3(); scrollToChunkCanvas(${id})'>${getChunkLabel(chunk)}</span></div>`;
    });
    html += `</div>`;
    return html;
}

let closeHighest3 = function() {
    highest3ModalOpen = false;
    modalOutsideTime = Date.now();
    $('#highest3Modal').remove();
}

let switchHighest3Tab = function(tab) {
    highestTab3 = tab;
    $('#highest3-data .h3-style-body').hide();
    $('#highest3-title .h3-style-button').removeClass('h3-active-tab');
    $('#highest3-title .h3-' + tab + '-button').addClass('h3-active-tab');
    $('#highest3-data .h3-' + tab + '-body').show();
    document.getElementById('highest3-data').scrollTop = 0;
}

let searchHighest3 = function() {
    let searchTemp = ($('#searchHighest3').val() || '').toLowerCase();
    $('#highest3-data .highest3-item').each(function() {
        if ($(this).text().toLowerCase().includes(searchTemp)) {
            $(this).removeClass('searchhide').show();
        } else {
            $(this).addClass('searchhide').hide();
        }
    });
}

let openHighest3 = function() {
    if (!inEntry && !importMenuOpen && !manualModalOpen && !detailsModalOpen && !notesModalOpen && !highscoreMenuOpen && !helpMenuOpen) {
        modal.generate('highest3Modal', onMobile);
        onMobile && hideMobileMenu();
        highest3ModalOpen = true;
        h3ChunkUid = 0;
        $('#searchHighest3').val('');
        $('.highest3-title').empty();
        $('.highest3-data').empty();

        let categories = [
            { name: 'All', match: function() { return true; } },
            { name: 'Drops', match: function(t) { return t.includes('drop'); } },
            { name: 'Spawns', match: function(t) { return t.includes('spawn'); } },
            { name: 'Shops', match: function(t) { return t === 'shop'; } },
            { name: 'Processing', match: function(t) { return t.startsWith('multi-'); } },
            { name: 'Other', match: function(t) { return !t.includes('drop') && !t.includes('spawn') && t !== 'shop' && !t.startsWith('multi-'); } }
        ];

        categories.forEach((cat) => {
            $('.highest3-title').append(`<div class='noscroll h3-style-button h3-${cat.name}-button' onclick='switchHighest3Tab("${cat.name}")'><span class='noscroll'>${cat.name}</span></div>`);
            $('.highest3-data').append(`<div class='noscroll h3-style-body h3-${cat.name}-body'></div>`);
        });

        if (!baseChunkData || !baseChunkData['items'] || Object.keys(baseChunkData['items']).length === 0) {
            categories.forEach((cat) => {
                $(`.h3-${cat.name}-body`).append(`<div class='noscroll highest3-item'><div class='noscroll highest3-item-name'>No items available. Unlock chunks and calculate tasks first.</div></div>`);
            });
        } else {
            Object.keys(baseChunkData['items']).filter((item) => !item.includes('^')).sort().forEach((itemName) => {
                let sources = baseChunkData['items'][itemName];
                let displayName = itemName.replaceAll(/~/g, '').replaceAll(/\|/g, '').replaceAll(/\*/g, '');
                let sourceTypes = Object.values(sources);
                let itemHtml = `<div class='noscroll highest3-item'><div class='noscroll highest3-item-name'>${displayName}</div>`;
                Object.keys(sources).forEach((sourceKey) => {
                    let sourceType = sources[sourceKey];
                    let chunks = getSourceChunks(sourceKey, sourceType);
                    let chunkLinksHtml = buildChunkLinksHtml(chunks);
                    itemHtml += `<div class='noscroll highest3-item-source'>${sourceKey} — ${formatSourceType(sourceType)}${chunkLinksHtml}</div>`;
                });
                itemHtml += `</div>`;
                categories.forEach((cat) => {
                    if (cat.name === 'All' || sourceTypes.some((t) => cat.match(t))) {
                        $(`.h3-${cat.name}-body`).append(itemHtml);
                    }
                });
            });
        }

        if (highestTab3 === undefined) {
            highestTab3 = 'All';
        }
        $('#highest3-data .h3-style-body').hide();
        $('.h3-' + highestTab3 + '-button').addClass('h3-active-tab');
        $('.h3-' + highestTab3 + '-body').show();
        $('#highest3Modal').show();
        modalOutsideTime = Date.now();
        document.getElementById('highest3-data').scrollTop = 0;
    }
}

// --- Outside-click and Escape key ---
$(document).on('mousedown', function(event) {
    if (!highest3ModalOpen) return;
    let rect = $('#highest3Modal .modal-content')[0].getBoundingClientRect();
    if (!(event.clientX >= rect.left && event.clientX <= rect.right && event.clientY >= rect.top && event.clientY <= rect.bottom) && (modalOutsideTime + 100 < Date.now())) {
        highest3ModalOpen && closeHighest3();
    }
});

$(document).on('keydown', function(e) {
    if (e.keyCode === 27 && highest3ModalOpen) {
        closeHighest3();
    }
});
</script>
</body>
</html>
